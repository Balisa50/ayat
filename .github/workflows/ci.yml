name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: AI pipeline failover tests
        # No network. Every case replaces global fetch with one that fails the
        # way a real provider fails, and asserts which provider ends up
        # answering. Needs no keys.
        run: npm run test:ai

      - name: Build
        run: npm run build
